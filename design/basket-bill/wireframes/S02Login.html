<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8"><title>S02Login — Basket Bill wireframe</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css">
<style>
body{padding:0}
</style>
<script>var m=location.search.match(/theme=([\w-]+)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);</script>
</head>
<body>
<!-- Bilingual sign-in, no language toggle before sign-in. Error shown in orange with an icon. -->

<div class="pos" style="display:grid;grid-template-columns:1fr 1fr">
<div style="background:var(--brand-500);color:var(--on-brand);padding:56px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px"><svg viewBox="0 0 64 64" width="72" height="72" style="flex:none" aria-label="Logo"><rect width="64" height="64" rx="16" fill="var(--brand-500)"/><path d="M20 26a12 12 0 0124 0" fill="none" stroke="var(--on-brand)" stroke-width="4" stroke-linecap="round"/><path d="M12 26h40l-5 22a4 4 0 01-4 3H21a4 4 0 01-4-3z" fill="var(--on-brand)"/><path d="M24 33v11M32 33v11M40 33v11" stroke="var(--brand-500)" stroke-width="3.5" stroke-linecap="round"/><circle cx="51" cy="13" r="5" fill="var(--sun-400)"/></svg><div style="font:700 44px/1.05 var(--font-ui);margin-top:16px">Supermarket POS</div><div style="font:400 18px var(--font-ui);opacity:.9">Fast, friendly billing for your counter.</div></div>
<div style="display:grid;place-items:center"><form class="pos-card" style="width:400px;padding:32px;display:flex;flex-direction:column;gap:14px">
<h1 style="margin:0;font:700 26px var(--font-ui)">Sign in / உள்நுழை</h1>
<div class="pos-field"><label>Username / பயனர் பெயர்</label><div class="pos-input">admin</div></div><div class="pos-field"><label>Password / கடவுச்சொல்</label><div class="pos-input">••••••••</div></div>
<div class="bb-note bad" style="font-size:15px"><svg viewBox="0 0 24 24" width="20" height="20" style="stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg><span>Wrong username or password.</span></div>
<span class="pos-btn main" style="justify-content:center;min-height:56px">Sign in / உள்நுழை</span></form></div></div>

</body>
</html>
