<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8"><title>S01Activation — Basket Bill wireframe</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css">
<style>
body{padding:0}
</style>
<script>var m=location.search.match(/theme=([\w-]+)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);</script>
</head>
<body>
<!-- Shown before login on a device that needs an activation key: request code with Copy, a key box and Activate. Tamil labels follow the language setting. -->

<div class="pos" style="display:grid;place-items:center"><div class="pos-card" style="width:520px;padding:32px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:12px"><svg viewBox="0 0 64 64" width="44" height="44" style="flex:none" aria-label="Logo"><rect width="64" height="64" rx="16" fill="var(--brand-500)"/><path d="M20 26a12 12 0 0124 0" fill="none" stroke="var(--on-brand)" stroke-width="4" stroke-linecap="round"/><path d="M12 26h40l-5 22a4 4 0 01-4 3H21a4 4 0 01-4-3z" fill="var(--on-brand)"/><path d="M24 33v11M32 33v11M40 33v11" stroke="var(--brand-500)" stroke-width="3.5" stroke-linecap="round"/><circle cx="51" cy="13" r="5" fill="var(--sun-400)"/></svg><h1 style="margin:0;font:700 26px var(--font-ui)">Activate this device</h1></div>
<div class="pos-note">This copy of Supermarket POS needs to be activated before it can be used.</div>
<div class="pos-field"><label>Request code</label><div style="display:flex;gap:10px;align-items:center"><code style="font:600 20px monospace;letter-spacing:2px;background:var(--surface-300);padding:8px 12px;border-radius:8px">7KQ2-M9XA-4RTD</code><span class="pos-btn ghost">Copy</span></div></div>
<div class="pos-field"><label>Activation key</label><div class="pos-input ph" style="min-height:96px;align-items:flex-start;padding-top:12px">Paste the key you were given</div></div>
<span class="pos-btn main" style="justify-content:center;min-height:56px">Activate</span></div></div>

</body>
</html>
